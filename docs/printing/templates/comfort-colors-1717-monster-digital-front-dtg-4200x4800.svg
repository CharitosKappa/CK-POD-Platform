<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="4200"
  height="4800"
  viewBox="0 0 4200 4800"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Comfort Colors 1717 Monster Digital front DTG template</title>
  <description id="description">
    Provider-derived 4200 by 4800 pixel guide canvas at 300 DPI. Hide or remove the
    GUIDES_DO_NOT_PRINT layer before exporting artwork.
  </description>

  <!--
    This document intentionally has no background fill.
    Hide or delete this complete layer before exporting the production PNG.
  -->
  <g
    id="GUIDES_DO_NOT_PRINT"
    inkscape:groupmode="layer"
    inkscape:label="GUIDES — HIDE BEFORE EXPORT"
    fill="none"
  >
    <rect
      x="10"
      y="10"
      width="4180"
      height="4780"
      stroke="#e13725"
      stroke-width="20"
    />
    <rect
      x="150"
      y="150"
      width="3900"
      height="4500"
      stroke="#111111"
      stroke-width="16"
      stroke-dasharray="48 32"
    />
    <path
      d="M 2100 150 V 4650 M 150 2400 H 4050"
      stroke="#1769aa"
      stroke-width="8"
      stroke-dasharray="24 24"
      opacity="0.7"
    />
    <circle cx="2100" cy="2400" r="32" fill="#1769aa" stroke="none" />

    <g
      fill="#111111"
      stroke="white"
      stroke-width="12"
      paint-order="stroke"
      font-family="Arial, Helvetica, sans-serif"
      text-anchor="middle"
    >
      <text x="2100" y="250" font-size="86" font-weight="700">
        GUIDES — HIDE BEFORE EXPORT
      </text>
      <text x="2100" y="365" font-size="58">
        Comfort Colors 1717 · Monster Digital · Front DTG
      </text>
      <text x="2100" y="445" font-size="52">
        4200 × 4800 px · 14 × 16 in · 300 DPI · transparent canvas
      </text>
      <text x="2100" y="4580" font-size="52">
        Dashed boundary: internal 0.5 in critical-content inset (not provider-published)
      </text>
    </g>
  </g>
</svg>
